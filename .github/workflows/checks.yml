name: DidaUP - verifiche automatiche

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Leggi il codice
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dipendenze e strumenti di test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r didaup/requirements.txt pytest==8.3.5 httpx==0.28.1
      - name: Controllo sintassi Python
        run: python -m compileall -q didaup/app
      - name: Controllo sintassi JavaScript
        run: |
          node --check didaup/app/static/site.js
          node --check didaup/app/static/mapping.js
          node --check didaup/app/static/cohort_review.js
          node --check didaup/app/static/workload.js
      - name: Test JavaScript (associazioni duplicate)
        run: node didaup/tests/mapping.test.cjs
      - name: Test JavaScript (ricerca ed esclusioni CdS)
        run: node didaup/tests/cohort_review.test.cjs
      - name: Test statici Office Scripts (prototipo OneDrive)
        run: node didaup/tests/office_scripts.test.cjs
      - name: Test con dati esclusivamente sintetici
        run: PYTHONPATH=didaup python -m pytest -q didaup/tests
      - name: Build immagine add-on
        run: docker build --file didaup/Dockerfile --tag didaup:test didaup
